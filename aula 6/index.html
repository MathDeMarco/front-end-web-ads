<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF_8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <link rel="stylesheet" href="./styles/global.css">
        <title>Conhecendo os displays</title>
    </head>
    <body>
        <header>
            <h1>Conhecendo os displays do CSS</h1>
        </header>
        <main>
            <section>
                <h2>Display block</h2>
                <div class="container-block">
                <div class="item">item 1</div>
                <div class="item">item 2 </div>
                <div class="item">item 3 </div>
                </div>
                <p>Elementos são blocos que ocupam a linha toda</p>
            </section>
            <section>
                <h2>Display inline</h2>
                <div class="container-inline">
                <div class="item">item 1</div>
                <div class="item">item 2 </div>
                <div class="item">item 3 </div>
                </div>
                <p>Elementos ficam em linha e respeitam o tamanho do conteúdo textual</p>
            </section>

        </main>
        <footer>
            <p>Projeto de compreensão de displays no CSS</p>
        </footer>

    </body>
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    </html>
